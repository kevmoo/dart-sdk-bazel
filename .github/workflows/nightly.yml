name: Nightly Full SDK Build

# The expensive tier of the validation roadmap (fable_thoughts.md §10 step 6,
# bead sdk-xw2): PR-time CI only *analyzes* //sdk:create_sdk (presubmit.sh);
# this job actually builds and smoke-tests the packaged SDK, catching
# execution-time regressions (training-run hangs, package-resolution depth,
# genrule breakage) and toolchain drift at bounded cost. Promote to PR-time
# once remote caching (Buildfarm/BuildBuddy) stabilizes.

on:
  schedule:
    # 08:00 UTC = midnight US-Pacific. Note: GitHub only runs schedules from
    # the default branch, and pauses them after ~60 days of repo inactivity.
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    # The full build's output base measures ~9 GB locally, and the setup-bazel
    # disk cache keeps a second copy of action outputs — too tight for the
    # ~14 GB free on a stock runner. Drop the big preinstalled toolchains we
    # never use (~25 GB reclaimed).
    - name: Free runner disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    # clone_dependencies.py (run by the module extensions) shallow-clones 18
    # DEPS repos into the workspace — invisible to every bazel-level cache.
    # EXACT key only, deliberately no restore-keys: the script skips existing
    # non-empty dirs without checking their revision, so a stale partial
    # restore would silently pin wrong revisions.
    - name: Cache third_party/pkg clones
      uses: actions/cache@v5
      with:
        path: third_party/pkg
        key: third-party-pkg-${{ hashFiles('DEPS') }}

    - name: Generate Synthetic CI Configurations
      run: |
        python3 tools/bazel/generate_debug_package_config.py
        python3 tools/generate_sdk_version_file.py

    # external-cache covers output_base/external (clang toolchain, sysroot,
    # CIPD prebuilt SDK, browsers), which Bazel's repository cache can never
    # hold (no sha256 on those downloads). disk-cache is keyed per workflow
    # so this job's multi-GB full-build cache does not evict the PR
    # workflow's caches from the 10 GB repo budget.
    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        external-cache: true
        repository-cache: true

    - name: Build packaged SDK + utility executables
      run: |
        bazel build //sdk:create_sdk //utils:gen_kernel_exe //utils:compile_platform_exe

    - name: Smoke test packaged SDK
      run: |
        ./bazel-bin/sdk/dart-sdk/bin/dart --version
        cat > /tmp/hello.dart <<'EOF'
        void main() {
          print('Hello from the nightly Bazel-built SDK!');
          print([1, 2, 3].map((x) => x * x).toList());
        }
        EOF
        output=$(./bazel-bin/sdk/dart-sdk/bin/dart /tmp/hello.dart)
        echo "$output"
        echo "$output" | grep -q '\[1, 4, 9\]'
