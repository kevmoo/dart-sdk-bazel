name: Buildifier

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  buildifier-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Buildifier
        run: |
          curl -fsSL https://github.com/bazelbuild/buildtools/releases/download/v8.2.1/buildifier-linux-amd64 -o /tmp/buildifier
          echo "6ceb7b0ab7cf66fceccc56a027d21d9cc557a7f34af37d2101edb56b92fcfa1a  /tmp/buildifier" | sha256sum -c -
          sudo install -m 0755 /tmp/buildifier /usr/local/bin/buildifier
          rm -f /tmp/buildifier

      - name: Run Buildifier
        run: |
          git ls-files '*BUILD.bazel' '*MODULE.bazel' '*.bzl' | grep -v 'gen_targets.bzl' | grep -v '^third_party/' | xargs buildifier --mode=check --lint=warn --warnings=all
